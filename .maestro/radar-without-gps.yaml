appId: io.github.nhilaire.mysteresbruguieres
name: Radar without location - I am here opens the riddle by hand
tags:
  - radar
---
# AC-14 second part.
- launchApp:
    clearState: true
    permissions:
      location: deny
- extendedWaitUntil:
    visible:
      id: "consent-screen"
    timeout: 30000
- tapOn:
    id: "consent-refuse"
- openLink: mysteresbruguieres://seed/3
- extendedWaitUntil:
    visible:
      id: "radar-screen"
    timeout: 10000
- takeScreenshot: 08-radar-no-gps
- tapOn:
    id: "radar-im-here"
- assertVisible:
    id: "quiz-screen"
