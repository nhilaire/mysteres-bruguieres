appId: io.github.nhilaire.mysteresbruguieres
name: Resume - kill and relaunch, Continue resumes on the same screen
tags:
  - resume
---
# AC-23 (same screen and same score after a relaunch), AC-06 (title of an adventure in progress).
- launchApp:
    clearState: true
    permissions:
      location: allow
- extendedWaitUntil:
    visible:
      id: "consent-screen"
    timeout: 30000
- tapOn:
    id: "consent-refuse"
- openLink: mysteresbruguieres://seed/33
- extendedWaitUntil:
    visible:
      id: "game-step-33"
    timeout: 10000
- stopApp
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: "title-screen"
    timeout: 30000
- assertVisible:
    id: "title-progress"
- assertVisible:
    id: "title-restart"
- takeScreenshot: 11-title-in-progress
- tapOn:
    id: "title-continue"
- extendedWaitUntil:
    visible:
      id: "game-step-33"
    timeout: 10000
- assertVisible:
    id: "end-score"
- assertVisible: ".*9.*/.*9"
