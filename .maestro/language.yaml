appId: io.github.nhilaire.mysteresbruguieres
name: Language - switch from the settings, the whole UI and the story follow at once, the choice survives a restart
tags:
  - language
---
# AC-03.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "consent-screen"
    timeout: 30000
- tapOn:
    id: "consent-refuse"
- tapOn:
    id: "title-settings"
- tapOn:
    id: "settings-language-fr"
- assertVisible: "Réglages"
- takeScreenshot: language-fr-settings
- tapOn:
    id: "settings-language-en"
- assertVisible: "Settings"
- takeScreenshot: language-en-settings
- tapOn:
    id: "settings-back"
- assertVisible: "Start the adventure"
- takeScreenshot: language-en-title
- stopApp
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: "title-screen"
    timeout: 30000
- assertVisible: "Start the adventure"
- openLink: mysteresbruguieres://seed/1
- extendedWaitUntil:
    visible:
      id: "game-step-1"
    timeout: 10000
- tapOn:
    id: "narration-tap"
- assertVisible: ".*journey.*|.*investigation.*|.*Bruguières.*"
- takeScreenshot: language-en-story
- tapOn:
    id: "game-menu"
- tapOn:
    id: "title-settings"
- tapOn:
    id: "settings-language-auto"
- tapOn:
    id: "settings-language-fr"
- tapOn:
    id: "settings-back"
- assertVisible: "Continuer"
